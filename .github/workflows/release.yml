name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish static binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: Verify tests before release
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cross-compile static binaries & build PyPI wheels
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for pair in \
            "linux amd64" \
            "linux arm64" \
            "darwin amd64" \
            "darwin arm64" \
            "windows amd64"; do
            set -- $pair
            GOOS=$1
            GOARCH=$2
            EXT=""
            if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
            OUT="dist/sixi-scanner-${TAG}-${GOOS}-${GOARCH}${EXT}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "-s -w -X main.version=${TAG}" \
              -o "$OUT" ./cmd/sixi-scanner
          done
          python3 packaging/pypi/build_wheels.py \
            --version "$TAG" \
            --dist-dir dist \
            --out-dir dist/wheels
          (cd dist && sha256sum sixi-scanner-* wheels/*.whl > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload wheel artifacts for optional PyPI publish
        uses: actions/upload-artifact@v4
        with:
          name: pypi-wheels
          path: dist/wheels/*.whl

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/sixi-scanner-* dist/wheels/*.whl dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/sixi-scanner-* dist/wheels/*.whl dist/SHA256SUMS \
              --title "sixi-scanner ${TAG}" \
              --generate-notes
          fi

  publish-pypi:
    name: Publish wheels to PyPI (when PYPI_PUBLISH=true)
    needs: release
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-wheels
          path: dist/wheels

      - name: Publish distribution wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheels
